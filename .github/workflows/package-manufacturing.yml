name: Package manufacturing files

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Rev A manufacturing package
        run: |
          mkdir -p dist
          zip -j dist/radio-mic-usb-ptt-revA-manufacturing.zip \
            manufacturing/revA/gerbers/* \
            manufacturing/revA/drill/* \
            manufacturing/revA/BOM_pcbway_revA.csv \
            manufacturing/revA/positions_revA.csv \
            manufacturing/revA/PCBWAY_NOTES_revA.md \
            manufacturing/revA/ORDER_INSTRUCTIONS.md \
            manufacturing/revA/drc_report_revA.txt \
            manufacturing/revA/drc_report_revA.json

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: radio-mic-usb-ptt-revA-manufacturing
          path: dist/radio-mic-usb-ptt-revA-manufacturing.zip

      - name: Attach package to tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/radio-mic-usb-ptt-revA-manufacturing.zip
