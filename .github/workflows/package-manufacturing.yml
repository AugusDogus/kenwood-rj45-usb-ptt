name: Package manufacturing files

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Rev A release files
        run: |
          mkdir -p dist
          zip -j dist/kenwood-rj45-usb-ptt-revA-fabrication.zip \
            manufacturing/revA/gerbers/* \
            manufacturing/revA/drill/*
          cp manufacturing/revA/BOM_pcbway_revA.csv dist/
          cp manufacturing/revA/positions_revA.csv dist/
          cp manufacturing/revA/PCBWAY_NOTES_revA.md dist/
          cp manufacturing/revA/ORDER_INSTRUCTIONS.md dist/

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: kenwood-rj45-usb-ptt-revA-manufacturing
          path: dist/*

      - name: Attach package to tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
